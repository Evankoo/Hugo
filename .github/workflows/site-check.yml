name: Site check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test change classification
        run: python3 scripts/test_classify_changes.py

      - name: Classify changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 scripts/classify_changes.py \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --format markdown | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Build pinned Hugo site
        run: ./build.sh

      - name: Check generated pages and internal links
        run: python3 scripts/check_site.py public
