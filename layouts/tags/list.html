{{ define "main" }}

<div class="topics-page animated fadeInDown">
  <p class="topics-page__eyebrow">话题</p>
  <h1 class="topics-page__title">{{ .Title }}</h1>

  {{ $pages := .Pages.ByDate.Reverse }}
  {{ if $pages }}
    <ul class="topic-article-list">
      {{ range $pages }}
        <li class="topic-article-item">
          <a class="topic-article-link" href="{{ .RelPermalink }}">{{ .Title }}</a>
          <span class="topic-article-date">{{ .Date.Format "2006-01-02" }}</span>
        </li>
      {{ end }}
    </ul>
  {{ else }}
    <p class="topics-page__empty">这个话题下暂无文章。</p>
  {{ end }}

  <p class="topics-page__back"><a href="{{ "/tags/" | relLangURL }}">← 所有话题</a></p>
</div>

{{ end }}
