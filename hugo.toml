# hugo.toml - 单一中文站点

baseURL = "https://evan-manual.com/"
languageCode = "zh-CN"
defaultContentLanguage = "zh"
title = "伊万的个人主页"
theme = "evan"

summaryLength = 140
enableEmoji = true
enableRobotsTXT = true
hasCJKLanguage = true

# 语法高亮
pygmentsUseClasses = true
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true

# Localized dates requires Hugo version 0.87.0
localizedDates = false

[permalinks]
post = "/post/:slug/"

# [params] 主题自定义参数
[params]
mermaidEnable = false
profilePicture = "images/profile.png"
favicon = "favicons/"   # 注意路径只到文件夹，不带文件名
customJs = ["js/custom.js"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

[taxonomies]
  tag = "tags"

[related]
  includeNewer = true
  threshold = 50
  toLower = true
[[related.indices]]
  name = "keywords"
  weight = 100
[[related.indices]]
  name = "tags"
  weight = 80

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[services]
# Enable Disqus.Disqus.Shortname
  [services.disqus]
    #shortname = 'your-disqus-shortname'
# Google Analytics
  [services.googleAnalytics]
    #ID = 'G-MEASUREMENT_ID'
